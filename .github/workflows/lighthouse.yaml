name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Performance, SEO, best practices
    runs-on: ubuntu-latest
    outputs:
      has_regression: ${{ steps.summary.outputs.has_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro build)
        run: pnpm run build

      - name: Lighthouse CI
        run: pnpm run lighthouse
        continue-on-error: true

      - name: Score summary
        id: summary
        if: ${{ !cancelled() }}
        run: |
          node scripts/lighthouse-summary.mjs
          cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "has_regression=$(cat lighthouse-regression.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload summary and badges
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-summary
          path: |
            lighthouse-summary.md
            lighthouse-badges.json
          if-no-files-found: error

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30

  report:
    name: Publish results
    needs: lighthouse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Download summary and badges
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-summary

      - name: Comment scores on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lighthouse
          path: lighthouse-summary.md

      - name: Open issue on scheduled regression
        if:
          ${{ github.event_name == 'schedule' &&
          needs.lighthouse.outputs.has_regression == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require("node:fs").readFileSync(
              "lighthouse-summary.md",
              "utf8",
            );
            const title = "Lighthouse regression (weekly sweep)";
            const labels = ["automated", "lighthouse"];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labels.join(","),
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels,
                body,
              });
            }

      - name: Update badges
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const badges = JSON.parse(
              require("node:fs").readFileSync("lighthouse-badges.json", "utf8"),
            );
            const files = Object.fromEntries(
              Object.entries(badges).map(([name, content]) => [
                name,
                { content: JSON.stringify(content) },
              ]),
            );
            await github.rest.gists.update({
              gist_id: "820df8fd7ec1ecb0ffd03f0727ba9222",
              files,
            });
