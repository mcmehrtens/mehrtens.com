name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm must be set up before setup-node so its cache can resolve the store.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These mirror `pnpm verify` and the diagnostics surfaced in the editor.
      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Type check (astro check)
        run: pnpm run check

      - name: Build (astro build)
        run: pnpm run build
