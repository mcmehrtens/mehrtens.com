name: Astro update check

on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for aged Astro updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Detect aged Astro updates
        id: check
        run: |
          node scripts/check-astro-update.mjs
          echo "has_update=$(cat astro-update-flag.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        if: ${{ steps.check.outputs.has_update == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require("node:fs").readFileSync(
              "astro-update.md",
              "utf8",
            );
            const title = "Astro update available (run `@astrojs/upgrade`)";
            const labels = ["automated", "astro-upgrade"];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labels.join(","),
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels,
                body,
              });
            }
