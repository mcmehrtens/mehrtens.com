name: External Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: External link check
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (astro build)
        run: pnpm run build

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config ./lychee.toml --no-progress --root-dir ${{ github.workspace
            }}/dist dist/**/*.html
          output: ./lychee/out.md
          fail: false
          jobSummary: true

      - name: Upload lychee report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lychee-report
          path: ./lychee/out.md
          if-no-files-found: error

  report:
    name: Report broken links
    needs: links
    if:
      ${{ !cancelled() && needs.links.result == 'success' && (github.event_name
      == 'pull_request' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Download lychee report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lychee-report
          path: ./lychee

      - name: Comment results on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lychee
          path: ./lychee/out.md

      - name: Open issue on broken links
        if:
          ${{ github.event_name == 'schedule' && needs.links.outputs.exit_code
          != 0 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require("node:fs").readFileSync(
              "./lychee/out.md",
              "utf8",
            );
            const title = "Broken external links (weekly sweep)";
            const labels = ["automated", "broken-links"];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: labels.join(","),
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels,
                body,
              });
            }
