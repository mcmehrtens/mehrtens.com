name: security.txt checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Signature, sync, expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check security.txt
        run: sh scripts/check-security-txt.sh
