name: security.txt checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Signature, sync, expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check security.txt
        run: sh scripts/check-security-txt.sh
